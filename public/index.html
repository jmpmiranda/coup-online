<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coup Online</title>
<style>
:root{--felt:#12332f;--panel:#1c4a43;--ink:#f3ecd9;--brass:#d4a94f;--dim:#8fb0a8}
*{box-sizing:border-box}
body{margin:0;background:var(--felt);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
h1,h2{font-family:Palatino,"Palatino Linotype",Georgia,serif;margin:.2em 0}
h1{font-size:2.6rem}
#app{max-width:720px;margin:0 auto;padding:12px}
button,input{font:inherit;border-radius:8px;border:1px solid var(--brass);padding:10px 14px;color:var(--ink)}
button{cursor:pointer;background:var(--brass);color:#2a1d00;font-weight:600;margin:3px}
button.alt{background:transparent;color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{background:#0d2623;width:100%;margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top{justify-content:space-between;background:var(--panel);border-radius:10px;padding:8px 12px}
.pl{background:var(--panel);border-radius:10px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box{background:#0d2623;border-radius:10px;padding:12px;margin:8px 0}
.tabs{margin:8px 0}.code{font:700 2rem Palatino,Georgia,serif;letter-spacing:.2em;color:var(--brass)}
.sw{width:32px;height:32px;padding:0;border-radius:50%;border:3px solid transparent;margin:2px}.sw.on{border-color:#fff}
.bar{height:8px;background:#0006;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brass)}
.err{color:#ff9d8f}.ok{color:#9fe3b0}
/* mesa */
.table{position:relative;display:grid;grid-template-columns:minmax(78px,1fr) minmax(0,1.5fr) minmax(78px,1fr);grid-template-areas:"t t t" "l c r" "m m m";gap:10px 6px;background:radial-gradient(ellipse at center,#22735f,#0e3a32);border:7px solid #6b4423;border-radius:22px;padding:10px 6px;margin:8px 0;box-shadow:inset 0 0 40px #000a}
.s-top{grid-area:t;display:flex;justify-content:space-evenly;gap:6px;flex-wrap:wrap}
.s-left{grid-area:l}.s-right{grid-area:r}.s-me{grid-area:m}
.center{grid-area:c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:120px}
.seat{position:relative;text-align:center;padding:4px;border-radius:12px;font-size:13px}
.seat.turn{outline:2px solid var(--brass);background:#0003}.seat.out{opacity:.5}
.who{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:3px}
.s-left .who,.s-right .who{flex-direction:column;gap:0}
.hand{display:flex;justify-content:center}
.cd{width:var(--cw,70px);aspect-ratio:5/7;position:relative;margin:2px;flex:none}
.cd svg{width:100%;height:100%;display:block;border-radius:7px;box-shadow:0 2px 6px #0008}
.cd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:7px}
.cd.dead svg{filter:brightness(.72)}
.cd.dead::after{content:"✕";position:absolute;top:3px;right:3px;width:18px;height:18px;line-height:18px;border-radius:50%;background:#c0392b;color:#fff;font-size:11px;font-weight:700;text-align:center}
.pick{cursor:pointer}.pick .cd{outline:3px solid var(--brass);border-radius:8px}
.deck{position:relative}.deck .cd{margin:0;box-shadow:3px 3px 0 #0a2a24,6px 6px 0 #0a2a24}
.deck b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;text-shadow:0 1px 4px #000}
.bub{position:absolute;z-index:5;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;background:#fff;color:#1d1d1d;padding:7px 11px;border-radius:12px;font-size:13px;font-weight:600;width:max-content;max-width:190px;box-shadow:0 2px 10px #0008}
.s-me .bub{top:auto;bottom:100%;margin:0 0 4px}
.rv{position:absolute;inset:0;z-index:8;background:#000b;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px}
.rv p{margin:0;font:700 1.1rem Palatino,Georgia,serif}
#cap{background:var(--brass);color:#2a1d00;border-radius:10px;padding:10px;margin:6px 0;font:700 1.1rem Palatino,Georgia,serif;text-align:center}
#log{max-height:130px;overflow:auto;font-size:14px;color:var(--dim)}
#app.wide{max-width:1000px}
button.big{font-size:1.4rem;padding:14px 26px;width:100%;margin:6px 0 0}
.pnl{background:var(--panel);border-radius:12px;padding:12px}
.cur{display:inline-flex;align-items:center;gap:2px;background:#0d2623;border-radius:20px;padding:6px 14px;font-weight:700}
.gem{display:inline-block;width:12px;height:12px;background:#5ad1e6;transform:rotate(45deg);margin:0 7px 0 4px}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--brass);border:2px solid #a47a1e;margin:0 6px 0 14px}
.hub{display:grid;gap:10px;grid-template-columns:1fr;grid-template-areas:"top" "ctr" "play" "left" "pass" "frd"}
.hb-top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hb-left{grid-area:left;display:flex;flex-direction:column;gap:6px}.hb-left button{margin:0}
.hb-ctr{grid-area:ctr;text-align:center}.hb-frd{grid-area:frd}.hb-pass{grid-area:pass;min-width:0}.hb-play{grid-area:play}
@media(min-width:760px){.hub{grid-template-columns:200px 1fr 250px;grid-template-areas:"top top top" "left ctr frd" "pass pass play"}}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px}
.lv{min-width:74px;text-align:center;border-radius:8px;padding:6px 4px;background:#0d2623;font-size:12px;flex:none}
.lv.done{opacity:.5}.lv.can{outline:2px solid var(--brass);cursor:pointer;background:#2b4a22}
.fxb{position:absolute;z-index:6;left:50%;bottom:100%;transform:translateX(-50%);background:var(--brass);color:#2a1d00;padding:5px 10px;border-radius:12px;font-size:13px;font-weight:700;width:max-content;max-width:170px}
@keyframes bn{50%{transform:translateY(-12px)}}@keyframes sk{25%{transform:translateX(-4px) rotate(-6deg)}75%{transform:translateX(4px) rotate(6deg)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes dn{25%{transform:rotate(-12deg) translateY(-6px)}75%{transform:rotate(12deg) translateY(-6px)}}
.g-bounce svg{animation:bn .5s 6}.g-shake svg{animation:sk .25s 12}.g-spin svg{animation:sp .8s 3}.g-dance svg{animation:dn .45s 7}
@media(prefers-reduced-motion:reduce){.who svg{animation:none!important}}
</style></head>

/* ---------- Conexão ---------- */
s.on('connect',async()=>{const tk=localStorage.tk;if(tk){const r=await api({t:'tok',tk});if(r.me){me=r.me;if(localStorage.code)s.emit('join',{code:localStorage.code})}else localStorage.removeItem('tk')}draw()});
s.on('state',async x=>{if(!st)await refresh();if(x.fx&&x.fx.k!==lastK){lastK=x.fx.k;fxOn=x.fx;clearTimeout(fxT);fxT=setTimeout(()=>{fxOn=null;draw()},3300)}st=x;err='';localStorage.code=x.code;if(!x.xchg)sel=[];if(x.phase!=='action')tgt=null;draw()});
s.on('err',m=>{err=m;if(!st)localStorage.removeItem('code');draw()});
s.on('invite',i=>{inv=i;draw()});
const mv=m=>{tgt=null;s.emit('move',m)};
const enter=c=>{inv=null;s.emit('join',{code:c})};
const leave=async()=>{st=null;scr='home';lastK=0;fxOn=null;localStorage.removeItem('code');await refresh();draw()};
const tog=i=>{const k=st.xchg.keep;if(sel.includes(i))sel=sel.filter(x=>x!==i);else if(sel.length<k)sel.push(i);draw()};
const g=i=>document.getElementById(i).value.trim();
async function auth(){
 const v=i=>(document.getElementById(i)||{}).value||'',e=v('e').trim(),p=v('p');
 const m={in:{t:'login',email:e,pass:p},up:{t:'reg',email:e,name:v('n').trim(),pass:p},forgot:{t:'forgot',email:e},reset:{t:'reset',email:e,code:v('k').trim(),pass:p}}[mode];
 const r=await api(m);err='';msg='';emailKeep=e;
 if(r.err)err=r.err;
 else if(r.verify){msg='Enviamos um e-mail para '+e+'. Abra a mensagem e toque em Confirmar conta. Depois é só entrar aqui.';mode='in'}
 else if(r.sent){msg='Se esse e-mail tiver conta, enviamos um código de 6 dígitos. Ele vale por 15 minutos.';mode='reset'}
 else if(r.reset){msg='Senha alterada! Entre com a nova senha.';mode='in'}
 else{localStorage.tk=r.token;me=r.me;if(location.search)history.replaceState(0,'','/')}
 draw();
}
async function call(m){const r=await api(m);if(r.err){err=r.err;msg=''}else{err='';msg=r.got||'';if(r.me)me=r.me}draw()}
const setAv=(k,v)=>{me.avatar={...me.avatar,[k]:v};me.skin=null;call({t:'avatar',a:me.avatar})};
const sa=(k,v)=>`setAv("${k}",${JSON.stringify(v)})`;

const cur=()=>`<span class="cur"><i class="gem"></i>${me.gems}<i class="coin"></i>${me.coins}</span>`;
const rw=r=>r.t==='coins'?r.n+' moedas':r.t==='gems'?r.n+' gemas':'Sorteio';
const go=x=>{scr=x;err='';msg='';draw()};
const ownedSk=k=>me.owner||(!k.owner&&(!k.c||me.skins.includes(k.id)));
const ownedIt=e=>me.owner||!e.c||me.items.includes(e.id);
function play(){if(pm==='bots')s.emit('join',{create:true,bots:3,lv:bl});else s.emit('join',{create:true,friends:pm==='amigos'})}

 const em=`<input id="e" type="email" placeholder="E-mail" autocomplete="email" value="${esc(emailKeep)}">`,pw=(ph,ac)=>`<input id="p" type="password" placeholder="${ph}" autocomplete="${ac}">`;
 const T={in:'Entrar',up:'Criar conta',forgot:'Esqueci minha senha',reset:'Nova senha'};
 const body={in:em+pw('Senha','current-password'),up:em+'<input id="n" placeholder="Seu nome no jogo" maxlength="14">'+pw('Senha (mínimo 6 caracteres)','new-password'),
  forgot:'<p>Digite o e-mail da sua conta. Enviaremos um código de 6 dígitos.</p>'+em,
  reset:em+'<input id="k" placeholder="Código recebido por e-mail" maxlength="6" inputmode="numeric">'+pw('Nova senha (mínimo 6 caracteres)','new-password')}[mode];
 const btn={in:'Entrar',up:'Criar conta',forgot:'Enviar código',reset:'Salvar nova senha'}[mode];
 const sw=(m,t)=>`<button class="alt" onclick="emailKeep=(document.getElementById('e')||{}).value||emailKeep;mode='${m}';err='';msg='';draw()">${t}</button>`;
 return `<h1>Coup</h1><p>Blefe, desafie e seja o último com influência.</p><div class="box"><h2>${T[mode]}</h2>${body}<button onclick="auth()">${btn}</button>
 ${mode==='in'?sw('up','Criar uma conta')+sw('forgot','Esqueci minha senha'):sw('in','Voltar para entrar')}
 <p class="err">${esc(err)}</p><p class="ok">${esc(msg)}</p></div>`}

 </div>`}

const itRow=e=>`<div class="pl"><div><b>${e.n}</b><br><small>${e.txt||'Movimento do personagem na partida'}</small></div>${ownedIt(e)?'<small>Você tem</small>':`<button ${me.coins<e.c?'disabled':''} onclick="call({t:'buy',id:'${e.id}'})">${e.c} moedas</button>`}</div>`;
const SCR={
 cfg:()=>sub('Configurações',`<div class="box"><h2>Conta</h2><p>${esc(me.email)}<br>Código de jogador: <b>${me.code}</b></p><input id="nm" value="${esc(me.name)}" maxlength="14"><button onclick="call({t:'name',name:g('nm')})">Salvar nome</button><button class="alt" onclick="localStorage.clear();location.href='/'">Sair da conta</button></div>
  <div class="box"><h2>Regras</h2><p>Cada jogador começa com 2 moedas e 2 cartas. Na sua vez, faça uma ação. Ações de personagem podem ser blefe e qualquer um pode duvidar. Quem perde a dúvida perde uma carta. Quem fica sem cartas está fora, e vence o último de pé.</p>
  <p><b>Renda</b> +1. <b>Ajuda externa</b> +2 (Duque bloqueia). <b>Golpe</b> paga 7 e o alvo perde uma carta (obrigatório com 10 moedas). <b>Duque</b> taxa +3. <b>Assassino</b> paga 3 e mata uma carta (Condessa bloqueia). <b>Capitão</b> extorque 2 moedas (Capitão ou Embaixador bloqueiam). <b>Embaixador</b> troca cartas.</p>
  <p>O baralho cresce com o número de jogadores: 4 jogadores usam 15 cartas (3 de cada).</p></div>`),
 miss:()=>sub('Missões',`<p>Missões dão XP, e o XP faz o passe avançar. As diárias renovam todo dia.</p><h2>Diárias</h2>${DM.map(k=>mrow(k,me.daily.s[k.k]||0,me.daily.cl.includes(k.id),true)).join('')}<h2>Conquistas</h2>${MS.map(k=>mrow(k,me.stats[k.k]||0,me.claimed.includes(k.id),false)).join('')}`),
 events:()=>sub('Eventos',(me.events.length?me.events.map(e=>`<div class="box"><b>${esc(e.title)}</b> <small>${esc(e.at||'')}</small><p>${esc(e.text)}</p>${me.owner?`<button class="alt" onclick="call({t:'evdel',id:'${e.id}'})">Apagar</button>`:''}</div>`).join(''):'<p>Nenhum evento no momento. Volte em breve!</p>')
  +(me.owner?`<div class="box"><h2>Novo evento</h2><input id="et" placeholder="Título" maxlength="60"><input id="ex" placeholder="Descrição" maxlength="400"><button onclick="call({t:'evadd',title:g('et'),text:g('ex')})">Publicar evento</button></div>`:'')),
 pass:()=>{const L=lvl();return sub('Passe',`<div class="pnl"><b>Nível ${L} de ${PASS.length}</b> <small>${L>=PASS.length?'completo':me.xp%XPL+'/'+XPL+' XP para o próximo nível'}</small><div class="bar"><i style="width:${L>=PASS.length?100:me.xp%XPL}%"></i></div><p><small>Ganhe XP completando missões.</small></p></div>`
  +PASS.map(r=>{const done=me.passClaimed.includes(r.l),can=L>=r.l&&!done;return `<div class="pl"><div><b>Nível ${r.l}</b><br><small>${rw(r)}</small></div>${done?'<small>Resgatado</small>':can?`<button onclick="call({t:'pass',l:${r.l}})">Resgatar</button>`:'<small>Bloqueado</small>'}</div>`}).join('')
  +`<div class="box"><b>Chances do sorteio</b><p><small>Sorteios comuns: 35% 3 gemas, 25% 100 moedas, 15% 8 gemas, 12% personagem raro, 8,5% épico, 3,5% lendário, 1% mítico.<br>Sorteio do nível 20: 20% 10 gemas, 15% 25 gemas, 25% raro, 22% épico, 12% lendário, 6% mítico.<br>Personagem repetido vira gemas.</small></p></div>`)},
 friends:()=>sub('Amigos',`<div class="box"><h2>Seu código de jogador</h2><div class="code">${me.code}</div><small>Passe esse código para seus amigos adicionarem você.</small></div>
  <div class="box"><input id="fc" placeholder="Código de um amigo" maxlength="6" style="text-transform:uppercase"><button onclick="call({t:'friend',code:g('fc')})">Adicionar amigo</button></div>
  ${me.friends.map(f=>`<div class="pl"><div class="row">${av(f.av,44)}<b>${esc(f.name)}</b></div><small>${f.on?'online':'offline'}</small></div>`).join('')||'<p>Você ainda não tem amigos. Troque códigos para começar.</p>'}
  <p><small>Para jogar juntos, escolha o modo Amigos na tela inicial e toque em JOGAR.</small></p>`),
 avatar:()=>{
  const a=me.avatar,sw=(k,L,cur)=>L.map(c=>`<button class="sw ${cur===c?'on':''}" style="background:${c}" aria-label="${c}" onclick='${sa(k,c)}'></button>`).join('');
  const ch=(k,L,cur)=>L.map((n,i)=>{const v=Array.isArray(n)?n[0]:i,t=Array.isArray(n)?n[1]:n;return `<button class="${cur===v?'':'alt'}" onclick='${sa(k,v)}'>${t}</button>`}).join('');
  return sub('Personagem',`<div class="box row"><div>${av(eff(me),140)}</div><div style="flex:1;min-width:230px">
   <b>Cabelo</b><br>${ch('h',OPT.h,a.h)}<br><b>Cor do cabelo</b><br>${sw('hc',HC,a.hc)}<br><b>Pele</b><br>${sw('skin',SKN,a.skin)}<br><b>Olhos</b><br>${sw('e',EYE,a.e||EYE[0])}<br>
   <b>Barba</b><br>${ch('b',OPT.b,a.b||0)}<br><b>Roupa</b><br>${ch('cl',OPT.cl,a.cl||0)}<br>${sw('oc',OC,a.oc)}<br><b>Acessório</b><br>${ch('x',OPT.x,a.x||'')}</div></div>
  <h2>Meus personagens</h2>${SK.filter(ownedSk).map(k=>`<div class="pl"><div class="row">${av(k.a,60)}<div><b>${k.n}</b><br><small>${k.r}${k.owner?' (só você)':''}</small></div></div>${me.skin===k.id?'<small>Em uso</small>':`<button onclick="call({t:'skin',id:'${k.id}'})">Usar</button>`}</div>`).join('')}
  ${me.skin?`<button class="alt" onclick="call({t:'skin',id:null})">Usar meu personagem</button>`:''}<p><small>Mais personagens na Loja (gemas) e nos sorteios do Passe.</small></p>`)},
 shop:()=>sub('Loja',`<h2>Personagens (gemas)</h2>${SK.filter(k=>k.c&&!k.owner).map(k=>`<div class="pl"><div class="row">${av(k.a,56)}<div><b>${k.n}</b><br><small>${k.r}</small></div></div>${ownedSk(k)?'<small>Você tem</small>':`<button ${me.gems<k.c?'disabled':''} onclick="call({t:'buy',id:'${k.id}'})">${k.c} gemas</button>`}</div>`).join('')}
  <h2>Comemorações (moedas)</h2>${EM.filter(e=>e.k==='cel').map(itRow).join('')}<h2>Gestos do personagem (moedas)</h2>${EM.filter(e=>e.k==='ges').map(itRow).join('')}
  <p><small>Gemas são raras: ganhe no Passe e nos sorteios. Moedas vêm das partidas e do Passe.</small></p>`)
};
const botLv=()=>st.players.some(p=>p.bot)?`<span class="row"><small>Dificuldade:</small>${[['facil','Fácil'],['medio','Médio'],['dificil','Difícil']].map(([k,t])=>`<button class="${st.lv===k?'':'alt'}" onclick="s.emit('blevel','${k}')">${t}</button>`).join('')}</span>`:'';
const emoRow=()=>st.phase==='over'?'':`<div class="box"><small>Comemorar:</small><br>${EM.filter(ownedIt).map(e=>`<button class="alt" onclick="s.emit('emote',{id:'${e.id}'})">${e.n}</button>`).join('')}</div>`;

function lobbyView(){
 const n=st.players.length,cp=Math.max(2,Math.round((2*n+7)/5)),host=st.host===st.me,fr=me.friends.filter(f=>f.on);
 return `<h1>Sala ${st.code}</h1><p>Passe o código para os amigos ou convide quem estiver online.</p>`
 +st.players.map(p=>`<div class="pl"><div class="row">${av(p.av,44)}<b>${esc(p.name)}</b>${p.bot?'<small>bot</small>':''}</div></div>`).join('')
 +`<p>${n} jogador(es): baralho de ${cp*5} cartas (${cp} de cada).</p>`
 +(host?`<button class="alt" onclick="s.emit('bot',1)">Adicionar bot</button><button class="alt" onclick="s.emit('bot',-1)">Remover bot</button>${botLv()}<button ${n<2?'disabled':''} onclick="s.emit('start')">Começar o jogo</button>`:'<p>Esperando o anfitrião começar.</p>')
 +(fr.length?`<div class="box">Convidar amigo online:<br>${fr.map(f=>`<button class="alt" onclick="api({t:'invite',code:'${f.code}',room:'${st.code}'})">${esc(f.name)}</button>`).join('')}</div>`:'')
 +`<button class="alt" onclick="leave()">Sair da sala</button><p class="err">${esc(err)}</p>`}

function gameView(){
 const n=st.players.length,idx=st.players.findIndex(p=>p.pid===st.me),mp=st.players[idx];
 const nm=id=>esc((st.players.find(p=>p.pid===id)||{}).name||''),pd=st.pd,my=st.turn===st.me;
 const o=[];for(let i=1;i<n;i++)o.push(st.players[(idx+i)%n]);
 const L=o.length>=2?o[0]:null,Rr=o.length>=2?o[o.length-1]:null,T=o.length===1?o:o.slice(1,-1);
 const seat=(p,cls,w)=>{
  const say=st.say&&st.say.pid===p.pid?`<div class="bub">${esc(st.say.text)}</div>`:'';
  const picking=p.pid===st.me&&st.phase==='lose'&&st.lose===st.me;const fe=fxOn&&fxOn.pid===p.pid?EM.find(e=>e.id===fxOn.id):null,fxb=fe&&fe.txt?`<div class="fxb">${esc(fe.txt)}</div>`:'',fcls=fe?(fe.css||'g-bounce'):'';
  const hand=p.cards.map((c,i)=>picking&&!c.dead?`<span class="pick" onclick="mv({t:'lose',i:${i}})">${cardHtml(c.c,0)}</span>`:cardHtml(c.c,c.dead)).join('');
  return `<div class="seat ${cls} ${p.pid===st.turn?'turn':''} ${p.alive?'':'out'}" style="--cw:${w}px">${say}${fxb}<div class="who ${fcls}">${av(p.av,cls==='s-me'?46:34)}<div><b>${esc(p.name)}</b><br><small>${p.coins} moedas</small></div></div><div class="hand">${hand}</div></div>`};
 const rv=st.reveal?`<div class="rv"><div style="--cw:84px">${cardHtml(st.reveal.c,!st.reveal.ok)}</div><p>${nm(st.reveal.pid)} ${st.reveal.ok?'tinha':'não tinha'} ${N[st.reveal.c]}${st.reveal.ok?'!':'. Era blefe!'}</p></div>`:'';
 let status='',ctl='';
 if(st.phase==='action'){
  status=my?'Sua vez. Escolha uma ação.':`Vez de ${nm(st.turn)}`;
  if(my&&mp.alive){
   if(tgt)ctl=`Alvo de ${A[tgt]}:<br>`+st.players.filter(p=>p.alive&&p.pid!==st.me).map(p=>`<button onclick="mv({t:'act',a:'${tgt}',target:'${p.pid}'})">${esc(p.name)}</button>`).join('')+`<button class="alt" onclick="tgt=null;draw()">Voltar</button>`;
   else ctl=Object.keys(A).map(a=>{const need=a==='coup'?7:a==='assassinate'?3:0,dis=mp.coins<need||(mp.coins>=10&&a!=='coup'),t=a==='coup'||a==='assassinate'||a==='steal';
    return `<button ${dis?'disabled':''} onclick="${t?`tgt='${a}';draw()`:`mv({t:'act',a:'${a}'})`}">${A[a]}</button>`}).join('')+(mp.coins>=10?'<p>Com 10 ou mais moedas, o Golpe é obrigatório.</p>':'');
  }
 }else if(st.phase==='react'){
  const b=pd.block;
  status=(b?`${nm(b.by)} bloqueou com ${N[b.char]}. Você duvida?`:`${nm(pd.actor)}: ${A[pd.a]}${pd.t?' em '+nm(pd.t):''}`)+`<br><small>Aguardando: ${pd.wait.map(nm).join(', ')||'ninguém'}</small>`;
  if(st.can)ctl=(st.can.chal?`<button onclick="mv({t:'chal'})">Duvidar</button>`:'')+st.can.block.map(h=>`<button onclick="mv({t:'block',ch:'${h}'})">Bloquear com ${N[h]}</button>`).join('')+`<button class="alt" onclick="mv({t:'pass'})">Deixar passar</button>`;
 }else if(st.phase==='wait'){
  status='<small>Acompanhe a jogada...</small>';
 }else if(st.phase==='lose'){
  status=st.lose===st.me?'Toque em uma das suas cartas para perdê-la.':`${nm(st.lose)} está escolhendo uma carta para perder.`;
 }else if(st.phase==='exchange'){
  if(st.xchg){status=`Escolha ${st.xchg.keep} carta(s) para manter.`;
   ctl=`<div class="row" style="--cw:72px">`+st.xchg.pool.map((c,i)=>`<span class="pick" onclick="tog(${i})" style="${sel.includes(i)?'filter:drop-shadow(0 0 6px #d4a94f)':''}">${cardHtml(c,0)}</span>`).join('')+`</div><button ${sel.length!==st.xchg.keep?'disabled':''} onclick="mv({t:'xchg',k:sel})">Confirmar troca</button>`;
  }else status=`${nm(st.turn)} está trocando cartas.`;
 }else if(st.phase==='over'){
  status=`<b>${nm(st.winner)} venceu!</b>`;
  ctl=(st.host===st.me?`<button onclick="s.emit('again')">Jogar de novo</button>`:'')+`<button class="alt" onclick="leave()">Voltar ao início</button>`;
 }
 const tw=n>=7?38:n>=5?46:54;
 return `<div class="row"><h2>Sala ${st.code}</h2></div>
 <div id="cap" aria-live="polite">${esc(st.log[st.log.length-1]||'')}</div>
 <div class="table">
  ${T.length?`<div class="s-top">${T.map(p=>seat(p,'s-t',tw)).join('')}</div>`:''}
  ${L?`<div class="s-left">${seat(L,'s-l',36)}</div>`:''}
  <div class="center"><div class="deck" style="--cw:58px">${cardHtml(null,0)}<b>${st.deck}</b></div><small>Monte</small></div>
  ${Rr?`<div class="s-right">${seat(Rr,'s-r',36)}</div>`:''}
  <div class="s-me">${seat(mp,'s-me',84)}</div>
  ${rv}
 </div>
 <div class="box">${status}<div>${ctl}</div></div>${emoRow()}
 ${mp.alive?'':'<p>Você foi eliminado. Continue acompanhando a partida.</p>'}
 <div class="box" id="log">${st.log.slice().reverse().map(esc).join('<br>')}</div>
 ${st.phase==='over'?'':'<button class="alt" onclick="leave()">Sair da sala</button>'}`}

function draw(){$.className=(me&&!st&&scr==='home')?'wide':'';$.innerHTML=!me?authView():!st?(SCR[scr]||hubView)():st.phase==='lobby'?lobbyView():gameView()}
draw();
</script></body></html>
