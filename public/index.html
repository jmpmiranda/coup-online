<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coup Online</title>
<style>
:root{--felt:#12332f;--panel:#1c4a43;--ink:#f3ecd9;--brass:#d4a94f;--dim:#8fb0a8}
*{box-sizing:border-box}
body{margin:0;background:var(--felt);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
h1,h2{font-family:Palatino,"Palatino Linotype",Georgia,serif;margin:.2em 0}
h1{font-size:2.6rem}
#app{max-width:720px;margin:0 auto;padding:12px}
button,input{font:inherit;border-radius:8px;border:1px solid var(--brass);padding:10px 14px;color:var(--ink)}
button{cursor:pointer;background:var(--brass);color:#2a1d00;font-weight:600;margin:3px}
button.alt{background:transparent;color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{background:#0d2623;width:100%;margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top{justify-content:space-between;background:var(--panel);border-radius:10px;padding:8px 12px}
.pl{background:var(--panel);border-radius:10px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box{background:#0d2623;border-radius:10px;padding:12px;margin:8px 0}
.tabs{margin:8px 0}.code{font:700 2rem Palatino,Georgia,serif;letter-spacing:.2em;color:var(--brass)}
.sw{width:32px;height:32px;padding:0;border-radius:50%;border:3px solid transparent;margin:2px}.sw.on{border-color:#fff}
.bar{height:8px;background:#0006;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brass)}
.err{color:#ff9d8f}.ok{color:#9fe3b0}
/* mesa */
.table{position:relative;display:grid;grid-template-columns:minmax(78px,1fr) minmax(0,1.5fr) minmax(78px,1fr);grid-template-areas:"t t t" "l c r" "m m m";gap:10px 6px;background:radial-gradient(ellipse at center,#22735f,#0e3a32);border:7px solid #6b4423;border-radius:22px;padding:10px 6px;margin:8px 0;box-shadow:inset 0 0 40px #000a}
.s-top{grid-area:t;display:flex;justify-content:space-evenly;gap:6px;flex-wrap:wrap}
.s-left{grid-area:l}.s-right{grid-area:r}.s-me{grid-area:m}
.center{grid-area:c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:120px}
.seat{position:relative;text-align:center;padding:4px;border-radius:12px;font-size:13px}
.seat.turn{outline:2px solid var(--brass);background:#0003}.seat.out{opacity:.5}
.who{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:3px}
.s-left .who,.s-right .who{flex-direction:column;gap:0}
.hand{display:flex;justify-content:center}
.cd{width:var(--cw,70px);aspect-ratio:5/7;position:relative;margin:2px;flex:none}
.cd svg{width:100%;height:100%;display:block;border-radius:7px;box-shadow:0 2px 6px #0008}
.cd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:7px}
.cd.dead svg{filter:brightness(.72)}
.cd.dead::after{content:"✕";position:absolute;top:3px;right:3px;width:18px;height:18px;line-height:18px;border-radius:50%;background:#c0392b;color:#fff;font-size:11px;font-weight:700;text-align:center}
.pick{cursor:pointer}.pick .cd{outline:3px solid var(--brass);border-radius:8px}
.deck{position:relative}.deck .cd{margin:0;box-shadow:3px 3px 0 #0a2a24,6px 6px 0 #0a2a24}
.deck b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;text-shadow:0 1px 4px #000}
.bub{position:absolute;z-index:5;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;background:#fff;color:#1d1d1d;padding:7px 11px;border-radius:12px;font-size:13px;font-weight:600;width:max-content;max-width:190px;box-shadow:0 2px 10px #0008}
.s-me .bub{top:auto;bottom:100%;margin:0 0 4px}
.rv{position:absolute;inset:0;z-index:8;background:#000b;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px}
.rv p{margin:0;font:700 1.1rem Palatino,Georgia,serif}
#cap{background:var(--brass);color:#2a1d00;border-radius:10px;padding:10px;margin:6px 0;font:700 1.1rem Palatino,Georgia,serif;text-align:center}
#log{max-height:130px;overflow:auto;font-size:14px;color:var(--dim)}
#app.wide{max-width:1000px}
button.big{font-size:1.4rem;padding:14px 26px;width:100%;margin:6px 0 0}
.pnl{background:var(--panel);border-radius:12px;padding:12px}
.cur{display:inline-flex;align-items:center;gap:2px;background:#0d2623;border-radius:20px;padding:6px 14px;font-weight:700}
.gem{display:inline-block;width:12px;height:12px;background:#5ad1e6;transform:rotate(45deg);margin:0 7px 0 4px}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--brass);border:2px solid #a47a1e;margin:0 6px 0 14px}
.hub{display:grid;gap:10px;grid-template-columns:1fr;grid-template-areas:"top" "ctr" "play" "left" "pass" "frd"}
.hb-top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hb-left{grid-area:left;display:flex;flex-direction:column;gap:6px}.hb-left button{margin:0}
.hb-ctr{grid-area:ctr;text-align:center}.hb-frd{grid-area:frd}.hb-pass{grid-area:pass;min-width:0}.hb-play{grid-area:play}
@media(min-width:760px){.hub{grid-template-columns:200px 1fr 250px;grid-template-areas:"top top top" "left ctr frd" "pass pass play"}}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px}
.lv{min-width:74px;text-align:center;border-radius:8px;padding:6px 4px;background:#0d2623;font-size:12px;flex:none}
.lv.done{opacity:.5}.lv.can{outline:2px solid var(--brass);cursor:pointer;background:#2b4a22}
.fxb{position:absolute;z-index:6;left:50%;bottom:100%;transform:translateX(-50%);background:var(--brass);color:#2a1d00;padding:5px 10px;border-radius:12px;font-size:13px;font-weight:700;width:max-content;max-width:170px}
@keyframes bn{50%{transform:translateY(-12px)}}@keyframes sk{25%{transform:translateX(-4px) rotate(-6deg)}75%{transform:translateX(4px) rotate(6deg)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes dn{25%{transform:rotate(-12deg) translateY(-6px)}75%{transform:rotate(12deg) translateY(-6px)}}
.g-bounce svg{animation:bn .5s 6}.g-shake svg{animation:sk .25s 12}.g-spin svg{animation:sp .8s 3}.g-dance svg{animation:dn .45s 7}
@media(prefers-reduced-motion:reduce){.who svg{animation:none!important}}
select{font:inherit;border-radius:8px;border:1px solid var(--brass);padding:10px;background:#0d2623;color:var(--ink);width:100%;margin:4px 0}
.pimg{object-fit:cover;object-position:top;border-radius:14%;display:block}
.g-bounce img{animation:bn .5s 6}.g-shake img{animation:sk .25s 12}.g-spin img{animation:sp .8s 3}.g-dance img{animation:dn .45s 7}
.avw{position:relative;display:inline-block;line-height:0;vertical-align:middle}
.avi{display:block;width:100%;height:100%}.avi svg,.avi img{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
.who.mving .avw{z-index:7;transform:scale(1.9);transform-origin:50% 100%}
.av-head,.av-hb{transform-origin:50px 62px}.av-body{transform-origin:50px 100px}
.mv-clap .ov,.mv-dance .ov,.mv-wave .ov{opacity:1}.mv-wave .aL{display:none}
@keyframes kCL{0%,100%{transform:rotate(0)}50%{transform:rotate(20deg)}}
@keyframes kCR{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg)}}
.mv-clap .aL{animation:kCL .35s 10}.mv-clap .aR{animation:kCR .35s 10}
@keyframes kWv{0%,100%{transform:rotate(30deg)}50%{transform:rotate(65deg)}}
.mv-wave .aR{transform:rotate(30deg);animation:kWv .5s 6}
@keyframes kDL{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-75deg)}}
@keyframes kDR{0%,100%{transform:rotate(75deg)}50%{transform:rotate(30deg)}}
.mv-dance .aL{transform:rotate(-30deg);animation:kDL .6s 6}.mv-dance .aR{transform:rotate(75deg);animation:kDR .6s 6}
@keyframes kSw{0%,100%{transform:rotate(-5deg) translateX(-2px)}50%{transform:rotate(5deg) translateX(2px)}}
@keyframes kSw2{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-6deg)}}
.mv-dance .av-body{animation:kSw .6s 6}.mv-dance .av-head,.mv-dance .av-hb{animation:kSw2 .6s 6}
@keyframes kSh{0%,100%{transform:none}30%,70%{transform:translateY(-6px)}}
@keyframes kSh2{0%,100%{transform:none}30%,70%{transform:translateY(-3px) rotate(-3deg)}}
.mv-shrug .av-body{animation:kSh .9s 3}.mv-shrug .av-head,.mv-shrug .av-hb{animation:kSh2 .9s 3}
@keyframes kNd{50%{transform:translateY(5px) rotate(3deg)}}
.mv-nod .av-head,.mv-nod .av-hb{animation:kNd .5s 5}
@keyframes kNo{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.mv-no .av-head,.mv-no .av-hb{animation:kNo .45s 5}
@keyframes kBw{0%,100%{transform:none}35%,65%{transform:translateY(9px) rotate(12deg)}}
.mv-bow .av-head,.mv-bow .av-hb{animation:kBw 1.6s 1}
@keyframes kBn{50%{transform:translateY(-3px)}}
.mv-jump .avi{animation:bn .5s 6}.mv-shake .avi{animation:sk .25s 12}.mv-spin .avi{animation:sp .8s 3}
.mv-clap .avi:not(.gen),.mv-wave .avi:not(.gen){animation:kBn .4s 8}
.mv-dance .avi:not(.gen){animation:kSw .6s 6}.mv-shrug .avi:not(.gen){animation:kSh .9s 3}
.mv-nod .avi:not(.gen){animation:kNd .5s 5}.mv-no .avi:not(.gen){animation:kNo .45s 5}.mv-bow .avi:not(.gen){animation:kBw 1.6s 1}
@media(prefers-reduced-motion:reduce){.avw *,.avi{animation:none!important}}
#cap .cap-say{display:flex;align-items:center;gap:10px;text-align:left;justify-content:center}#cap .cap-say+.cap-say{margin-top:6px}
.seat.speaking{outline:2px solid #fff;background:#ffffff18}
.stagebox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;text-align:center;background:#0b2a25dd;border-radius:16px;padding:6px 16px 4px}
.stname{font:700 .95rem Palatino,Georgia,serif;color:var(--brass)}.rig{display:block;margin:0 auto;overflow:visible}
textarea{font:inherit;border-radius:8px;border:1px solid var(--brass);padding:10px;background:#0d2623;color:var(--ink);width:100%;margin:4px 0}
details{margin:8px 0}details summary{cursor:pointer}.rn{display:block;margin:6px 0}
</style></head>

 return `<div class="box"><b>${esc(e.title)}</b> <small>${MODEL[md]||''}${e.start||e.end?' | '+esc(e.start||'...')+' até '+esc(e.end||'...'):''}${e.active?'':' | fora do período'}</small><p>${esc(e.text||'')}</p>${e.rl?`<p><small>${esc(rulesTxt(e.rl))}</small></p>`:''}
 ${g?`<p>Meta: ${goalTxt(g)} <small>(${Math.min(my.n,g.n)}/${g.n})</small></p><div class="bar"><i style="width:${Math.min(100,my.n/g.n*100)}%"></i></div><p><small>Prêmio: ${prizeTxt(e.prize||{})}</small></p>${my.c?'<small>Prêmio resgatado</small>':done?`<button onclick="call({t:'evclaim',id:'${e.id}'})">Resgatar prêmio</button>`:''}`:''}${md==='dobro'&&e.active?'<p><small>Suas moedas das partidas valem em dobro agora.</small></p>':''}${play}</div>`};
const fv=i=>document.getElementById(i);
function resizeImg(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const S=512,c=document.createElement('canvas');c.width=S;c.height=S;const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)*.25;c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,S,S);ok(c.toDataURL('image/jpeg',.85))};im.onerror=()=>no(new Error('Imagem inválida.'));im.src=fr.result};fr.onerror=()=>no(new Error('Não consegui ler o arquivo.'));fr.readAsDataURL(file)})}
async function imgFrom(i){const f=fv(i)&&fv(i).files[0];if(!f)throw new Error('Escolha uma imagem primeiro.');return resizeImg(f)}

function pickView(){
 const n=st.pickN,mine=st.myPicks,done=mine>=n;
 return `<h2>Escolha ${n} carta(s)</h2><p>Escolha de qualquer personagem do baralho do jogo. As outras cartas da sua mão serão sorteadas.</p>${done?'<p>Escolha feita. Aguardando os outros jogadores...</p>':`<p>Você escolheu ${mine} de ${n}.</p><div class="row" style="--cw:84px">${st.pickChars.map(c=>`<span class="pick" onclick="s.emit('pick','${c}')">${cardHtml(c,0)}</span>`).join('')}</div>`}<button class="alt" onclick="leave()">Sair da sala</button>`}
const rulesTxt=rl=>{if(!rl)return '';const o=[`${rl.hand} carta(s) por jogador`,`${rl.coins} moeda(s) iniciais`,`Golpe custa ${rl.coup} (obrigatório com ${rl.force})`];
 if(rl.pick)o.push(`cada um escolhe ${rl.pick} carta(s)`);if(rl.firstRule||(rl.firstRule===undefined&&rl.first))o.push('primeira jogada: só Renda');
 if(rl.chars)o.push('cartas: '+Object.entries(rl.chars).map(([c,n])=>`${n}x ${N[c]}`).join(', '));if(rl.off&&rl.off.length)o.push('ações desligadas: '+rl.off.map(a=>A[a]||a).join(', '));return o.join('; ')+'.'};

async function admJson(){try{const a=JSON.parse(fv('ja').value);await call({t:'adm_addskin',n:fv('jn').value,r:fv('jr').value,c:+fv('jc').value||0,noRaffle:fv('jq').checked,owner:fv('jo').checked,av:a})}catch(e){err=e.message;draw()}}

const ruleForm=()=>`<details><summary><b>Regras do jogo do evento</b> (só valem no tipo "Jogo com regras próprias")</summary>
 <p><small>Deixe vazio para usar o padrão. Em cartas, informe quantas cópias de cada personagem entram no baralho (tudo vazio = baralho padrão).</small></p>
 <div class="row"><button class="alt" onclick="preset('1x1')">Modelo 1x1</button><button class="alt" onclick="preset('mesa')">Modelo mesa cheia</button><button class="alt" onclick="preset('novos')">Com Bufão e Burocrata</button></div>
 ${CH7.map(c=>RN('rc_'+c,'Cópias de '+N[c],'0')).join('')}
 ${RN('rh','Cartas na mão','2')}${RN('rco','Moedas iniciais','2')}${RN('rpk','Cartas que cada jogador escolhe','0')}${RN('rcp','Custo do Golpe','7')}${RN('rfo','Golpe obrigatório a partir de','10')}${RN('ras','Custo do Assassinato','3')}${RN('rin','Ganho da Renda','1')}${RN('rai','Ganho da Ajuda externa','2')}${RN('rtx','Ganho do Taxar','3')}${RN('rst','Moedas da Extorsão','2')}${RN('rcoop','Moedas pegas na Cooperação','3')}${RN('rmin','Mínimo de jogadores','')}${RN('rmax','Máximo de jogadores','')}
 <label><input id="rfi" type="checkbox" style="width:auto"> Primeira jogada só pode ser Renda</label><br><b>Ações desligadas</b><br>${OFFA.map(a=>`<label><input id="roff_${a}" type="checkbox" style="width:auto"> ${OFFN[a]}</label> `).join('')}</details>`;
const rulesFromForm=()=>{const n=i=>{const e=fv(i);return e&&e.value!==''?+e.value:undefined},chars={};CH7.forEach(c=>{const v=n('rc_'+c);if(v)chars[c]=v});
 return{chars:Object.keys(chars).length?chars:undefined,hand:n('rh'),coins:n('rco'),pick:n('rpk'),coup:n('rcp'),force:n('rfo'),assassinate:n('ras'),income:n('rin'),aid:n('rai'),tax:n('rtx'),steal:n('rst'),coop:n('rcoop'),min:n('rmin'),max:n('rmax'),first:fv('rfi').checked,off:OFFA.filter(a=>fv('roff_'+a).checked)}};
function preset(k){const set=(i,v)=>{const e=fv(i);if(e)e[e.type==='checkbox'?'checked':'value']=v};
 CH7.forEach(c=>set('rc_'+c,''));fv('em').value='regras';
 if(k==='1x1'){['duke','assassin','captain','ambassador','contessa'].forEach(c=>set('rc_'+c,1));set('rpk',1);set('rmin',2);set('rmax',2);set('rfi',true)}
 if(k==='mesa'){set('rmin',6);set('rmax',10)}
 if(k==='novos'){['duke','assassin','captain','contessa','jester','bureaucrat'].forEach(c=>set('rc_'+c,3))}}

  <p><small>Gemas são raras: ganhe no Passe e nos sorteios. Moedas vêm das partidas e do Passe.</small></p>`)
};
const botLv=()=>st.players.some(p=>p.bot)?`<span class="row"><small>Dificuldade:</small>${[['facil','Fácil'],['medio','Médio'],['dificil','Difícil']].map(([k,t])=>`<button class="${st.lv===k?'':'alt'}" onclick="s.emit('blevel','${k}')">${t}</button>`).join('')}</span>`:'';
const emoRow=()=>st.phase==='over'?'':`<div class="box"><small>Comemorar:</small><br>${EMS().filter(ownedIt).map(e=>`<button class="alt" onclick="s.emit('emote',{id:'${e.id}'})">${e.n}</button>`).join('')}</div>`;

function lobbyView(){
 const n=st.players.length,cp=Math.max(2,Math.round((2*n+7)/5)),host=st.host===st.me,fr=me.friends.filter(f=>f.on);
 return `<h1>Sala ${st.code}</h1>${st.evTitle?`<p><b>Evento: ${esc(st.evTitle)}</b></p>`:''}<p><small>${esc(rulesTxt(st.rl))}</small></p><p>Passe o código para os amigos ou convide quem estiver online. Mínimo de ${st.min} jogadores.</p>`
 +st.players.map(p=>`<div class="pl"><div class="row">${av(p.av,44)}<b>${esc(p.name)}</b>${p.bot?'<small>bot</small>':''}</div></div>`).join('')
 +`<p>${n} jogador(es).${st.rl.chars?'':` Baralho: ${cp*5} cartas (${cp} de cada).`}</p>`
 +(host?`<button class="alt" onclick="s.emit('bot',1)">Adicionar bot</button><button class="alt" onclick="s.emit('bot',-1)">Remover bot</button>${botLv()}<button ${n<st.min?'disabled':''} onclick="s.emit('start')">Começar o jogo</button>`:'<p>Esperando o anfitrião começar.</p>')
 +(fr.length?`<div class="box">Convidar amigo online:<br>${fr.map(f=>`<button class="alt" onclick="api({t:'invite',code:'${f.code}',room:'${st.code}'})">${esc(f.name)}</button>`).join('')}</div>`:'')
 +`<button class="alt" onclick="leave()">Sair da sala</button><p class="err">${esc(err)}</p>`}

function gameView(){
 const n=st.players.length,idx=st.players.findIndex(p=>p.pid===st.me),mp=st.players[idx];
 const nm=id=>esc((st.players.find(p=>p.pid===id)||{}).name||''),pd=st.pd,my=st.turn===st.me;
 const o=[];for(let i=1;i<n;i++)o.push(st.players[(idx+i)%n]);
 const L=o.length>=2?o[0]:null,Rr=o.length>=2?o[o.length-1]:null,T=o.length===1?o:o.slice(1,-1);
 const seat=(p,cls,w)=>{
  const say=st.say&&st.say.pid===p.pid?`<div class="bub">${esc(st.say.text)}</div>`:'';
  const picking=p.pid===st.me&&st.phase==='lose'&&st.lose===st.me;const fe=fxOn&&fxOn.pid===p.pid?EMS().find(e=>e.id===fxOn.id):null,fxb=fe&&fe.txt?`<div class="fxb">${esc(fe.txt)}</div>`:'',fcls=fe&&fe.mv?'mving mv-'+fe.mv:'';
  const hand=p.cards.map((c,i)=>picking&&!c.dead?`<span class="pick" onclick="mv({t:'lose',i:${i}})">${cardHtml(c.c,0)}</span>`:cardHtml(c.c,c.dead)).join('');
  return `<div class="seat ${cls} ${p.pid===st.turn?'turn':''} ${p.alive?'':'out'} ${st.say&&st.say.pid===p.pid?'speaking':''}" style="--cw:${w}px"><div class="who">${av(p.av,cls==='s-me'?46:34)}<div><b>${esc(p.name)}</b><br><small>${p.coins} moedas</small></div></div><div class="hand">${hand}</div></div>`};
 const rv=st.reveal?`<div class="rv"><div style="--cw:84px">${cardHtml(st.reveal.c,!st.reveal.ok)}</div><p>${nm(st.reveal.pid)} ${st.reveal.ok?'tinha':'não tinha'} ${N[st.reveal.c]}${st.reveal.ok?'!':'. Era blefe!'}</p></div>`:'';
 let status='',ctl='';
 if(st.phase==='action'){
  status=my?'Sua vez. Escolha uma ação.':`Vez de ${nm(st.turn)}`;
  if(my&&mp.alive){
   if(tgt)ctl=`Alvo de ${A[tgt]}:<br>`+st.players.filter(p=>p.alive&&p.pid!==st.me).map(p=>`<button onclick="mv({t:'act',a:'${tgt}',target:'${p.pid}'})">${esc(p.name)}</button>`).join('')+`<button class="alt" onclick="tgt=null;draw()">Voltar</button>`;
   else{const rl=st.rl,fo=rl.first;ctl=rl.acts.map(({a,cost})=>{const dis=mp.coins<cost||(mp.coins>=rl.force&&a!=='coup')||(fo&&a!=='income');
    return `<button ${dis?'disabled':''} onclick="${TGT[a]?`tgt='${a}';draw()`:`mv({t:'act',a:'${a}'})`}">${lbl(a)}</button>`}).join('')+(mp.coins>=rl.force?`<p>Com ${rl.force} ou mais moedas, o Golpe é obrigatório.</p>`:'')+(fo?'<p>Primeira jogada: só é permitido pegar Renda.</p>':'')}
  }
 }else if(st.phase==='react'){
  const b=pd.block;
  status=(b?`${nm(b.by)} bloqueou com ${N[b.char]}. Você duvida?`:`${nm(pd.actor)}: ${A[pd.a]}${pd.t?' em '+nm(pd.t):''}`)+`<br><small>Aguardando: ${pd.wait.map(nm).join(', ')||'ninguém'}</small>`;
  if(st.can)ctl=(st.can.chal?`<button onclick="mv({t:'chal'})">Duvidar</button>`:'')+st.can.block.map(h=>`<button onclick="mv({t:'block',ch:'${h}'})">Bloquear com ${N[h]}</button>`).join('')+`<button class="alt" onclick="mv({t:'pass'})">Deixar passar</button>`;
 }else if(st.phase==='wait'){
  status='<small>Acompanhe a jogada...</small>';
 }else if(st.phase==='lose'){
  status=st.lose===st.me?'Toque em uma das suas cartas para perdê-la.':`${nm(st.lose)} está escolhendo uma carta para perder.`;
 }else if(st.phase==='exchange'){
  if(st.xchg){const x=st.xchg;
   status=x.j?`Bufão: escolha ${x.keep} carta(s) para manter.${sel.length===x.keep?' Agora toque na carta que vai para o alvo.':''}`:`Escolha ${x.keep} carta(s) para manter.`;
   ctl=`<div class="row" style="--cw:72px">`+x.pool.map((c,i)=>{const ch=sel.includes(i),g=x.j&&sel.length===x.keep&&!ch;return `<span class="pick" onclick="${g?`mv({t:'xchg',k:sel,g:${i}})`:`tog(${i})`}" style="${ch?'filter:drop-shadow(0 0 6px #d4a94f)':''}">${cardHtml(c,0)}</span>`}).join('')+`</div>`+(x.j?'':`<button ${sel.length!==x.keep?'disabled':''} onclick="mv({t:'xchg',k:sel})">Confirmar troca</button>`);
  }else status=`${nm(st.turn)} está trocando cartas.`;
 }else if(st.phase==='over'){
  status=`<b>${nm(st.winner)} venceu!</b>`;
  ctl=(st.host===st.me?`<button onclick="s.emit('again')">Jogar de novo</button>`:'')+`<button class="alt" onclick="leave()">Voltar ao início</button>`;
 }
 const tw=n>=7?38:n>=5?46:54;
 return `<div class="row"><h2>Sala ${st.code}</h2></div>
 ${capHtml()}
 <div class="table">
  ${T.length?`<div class="s-top">${T.map(p=>seat(p,'s-t',tw)).join('')}</div>`:''}
  ${L?`<div class="s-left">${seat(L,'s-l',36)}</div>`:''}
  <div class="center"><div class="deck" style="--cw:58px">${cardHtml(null,0)}<b>${st.deck}</b></div><small>Monte</small></div>
  ${Rr?`<div class="s-right">${seat(Rr,'s-r',36)}</div>`:''}
  <div class="s-me">${seat(mp,'s-me',84)}</div>
  ${rv}${stageHtml()}
 </div>
 <div class="box">${status}<div>${ctl}</div></div>${emoRow()}
 ${mp.alive?'':'<p>Você foi eliminado. Continue acompanhando a partida.</p>'}
 <div class="box" id="log">${st.log.slice().reverse().map(esc).join('<br>')}</div>
 ${st.phase==='over'?'':'<button class="alt" onclick="leave()">Sair da sala</button>'}`}

function draw(){drawRaw();startRigs()}
function drawRaw(){$.className=(me&&!st&&scr==='home')?'wide':'';$.innerHTML=!me?authView():!st?(SCR[scr]||hubView)():st.phase==='lobby'?lobbyView():st.phase==='pick'?pickView():gameView()}
draw();
</script></body></html>
